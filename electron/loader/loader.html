<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>OpenVOCS</title>
    <style>
        :root {
            --bg: #222125;
            --fg: #eee;
            --muted: #9a9a9e;
            --track: #3a393e;
            --accent: #eee;
            --error: #d0607a;
            --button: #4a494e;
            --logo: #8e8d92;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1rem;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--fg);
            font: 15px system-ui, sans-serif;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .logo {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .logo img {
            position: absolute;
            inset: 18px;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--logo);
        }

        .spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid var(--track);
            border-top-color: var(--accent);
            animation: spin 1.1s linear infinite;
        }

        .idle .spinner {
            display: none;
        }

        .retrying .spinner {
            border-top-color: var(--error);
            animation-duration: 2.4s;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation-duration: 6s;
            }
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
        }

        .server {
            color: var(--muted);
            word-break: break-all;
        }

        .status {
            min-height: 1.4em;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .error {
            color: var(--error);
            font-size: 13px;
            max-width: 32rem;
        }

        .buttons {
            display: flex;
            gap: 0.75rem;
        }

        .buttons a {
            padding: 0.5rem 1.1rem;
            border-radius: 4px;
            background: var(--button);
            color: var(--fg);
            text-decoration: none;
        }

        .buttons a:hover {
            filter: brightness(1.2);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="logo">
        <div class="spinner"></div>
        <img src="../build/icon.png" alt="">
    </div>
    <h1 id="title">Connecting to OpenVOCS</h1>
    <div class="server" id="server"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="error" id="error" hidden></div>
    <div class="buttons" id="buttons" hidden>
        <a href="openvocs:retry" id="retry">Retry now</a>
        <a href="openvocs:settings">OpenVOCS Client Settings…</a>
    </div>
    <script src="loader.js"></script>
</body>

</html>
